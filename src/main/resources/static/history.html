<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#21376e">
    <title>Weather History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
</head>
<body>

<div class="safari-top-anchor"></div>
<div class="safari-bottom-anchor"></div>

<div class="history-page">

    <div class="history-page-topbar">
        <a class="back-to-dashboard" href="/">&larr; Dashboard</a>
        <div class="history-topbar-controls">
            <div id="hist-picker-wrapper" class="history-picker-group">
                <span class="history-picker-label">Date</span>
                <input type="text" id="hist-date-input" class="db-date-input" placeholder="Select a date" readonly>
            </div>
            <div class="history-period-tabs" id="hist-period-tabs">
                <button class="history-period-btn active" data-days="1">Day</button>
                <button class="history-period-btn" data-days="7">7D</button>
                <button class="history-period-btn" data-days="14">14D</button>
                <button class="history-period-btn" data-days="30">30D</button>
            </div>
        </div>
    </div>

    <!-- Summary card -->
    <div class="configuration_block history-page-card" id="hist-summary-card">
        <div class="card-header">
            <h3>
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span id="hist-summary-title">Day Summary</span>
            </h3>
            <span class="history-no-data" id="hist-no-data" hidden></span>
        </div>

        <div class="history-stats-grid" id="hist-stats-grid">
            <div class="history-stats-header">
                <span></span>
                <span>Min</span>
                <span>Max</span>
                <span>Avg</span>
            </div>
            <div class="history-stat-row" id="hist-temp-row">
                <span class="history-stat-metric">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0Z"/>
                    </svg>
                    Temperature
                </span>
                <span class="history-stat-val" id="hist-temp-min">–</span>
                <span class="history-stat-val" id="hist-temp-max">–</span>
                <span class="history-stat-val" id="hist-temp-avg">–</span>
            </div>
            <div class="history-stat-row" id="hist-pres-row">
                <span class="history-stat-metric">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>
                    </svg>
                    Pressure
                </span>
                <span class="history-stat-val" id="hist-pres-min">–</span>
                <span class="history-stat-val" id="hist-pres-max">–</span>
                <span class="history-stat-val" id="hist-pres-avg">–</span>
            </div>
            <div class="history-stat-row" id="hist-hum-row">
                <span class="history-stat-metric">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7Z"/>
                    </svg>
                    Humidity
                </span>
                <span class="history-stat-val" id="hist-hum-min">–</span>
                <span class="history-stat-val" id="hist-hum-max">–</span>
                <span class="history-stat-val" id="hist-hum-avg">–</span>
            </div>
        </div>
    </div>

    <!-- Chart card -->
    <div class="configuration_block history-page-card history-chart-card">
        <div class="chart-header">
            <h3 id="hist-chart-title">Hourly</h3>
            <div class="history-metric-tabs" id="hist-metric-tabs">
                <button class="history-metric-tab active" data-metric="temperature">Temperature</button>
                <button class="history-metric-tab" data-metric="pressure">Pressure</button>
                <button class="history-metric-tab" data-metric="humidity">Humidity</button>
            </div>
        </div>
        <div class="hist-period-stats" id="hist-period-stats" hidden>
            <span class="hist-period-stat">Avg <span id="hist-chart-avg">–</span></span>
            <span class="hist-period-sep">·</span>
            <span class="hist-period-stat hist-period-high">High <span id="hist-chart-high">–</span></span>
            <span class="hist-period-sep">·</span>
            <span class="hist-period-stat hist-period-low">Low <span id="hist-chart-low">–</span></span>
        </div>
        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>
        <p class="history-chart-empty" id="hist-chart-empty" hidden>No chart data for this day</p>
    </div>

</div>

<script type="module" src="/js/history.js"></script>
</body>
</html>

spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    clean-disabled: true

  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 30000
    max-lifetime: 1800000
    connection-timeout: 20000

mqtt:
  enabled: true

# SecurityConfig permits everything outside /admin/**, so actuator is reachable
# without auth — hence health only, with no details. The response is a bare
# {"status":"UP"}, which is all the container healthcheck needs and gives an
# anonymous visitor nothing about the database or broker.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


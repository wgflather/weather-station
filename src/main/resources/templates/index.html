<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<div id="global-popup" class="details-popup"></div>
<body th:with="d=${dashboard}">

<div class="safari-top-anchor"></div>
<div class="safari-bottom-anchor"></div>

<div class="today_data_block">
    <div class="datetime-container">
        <div class="date-row">
            <span id="fullDay">Thursday</span>
            <span id="date-day-num">11,</span>
        </div>
        <span id="realTime">19:50</span>
    </div>

    <div class="astro-grid">
        <div class="astro-item">
            <svg class="astro-icon astro-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <span id="sun-rise" class="astro-time">--:--</span>
        </div>

        <div class="astro-item">
            <svg class="astro-icon astro-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v2M4.93 4.93l1.41 1.41M2 12h2M20 12h2M19.07 4.93l-1.41 1.41"></path>
                <path d="M22 22H2M16 14a4 4 0 0 0-8 0"></path>
            </svg>
            <span id="sun-set" class="astro-time">--:--</span>
        </div>

        <div class="astro-item">
            <svg class="astro-icon astro-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
            <span id="moon-rise" class="astro-time">--:--</span>
        </div>

        <div class="astro-item">
            <svg class="astro-icon astro-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" opacity="0.6"></path>
                <path d="M22 22H2"></path>
            </svg>
            <span id="moon-set" class="astro-time">--:--</span>
        </div>
    </div>
</div>

<div class="dashboard-row row-full">
    <div class="temperature_block unified-card" id="temperature-card">
        <div class="card-header">
            <h3>Temperature</h3>
            <span class="status-circle"></span>
            <div class="details-popup"></div>
        </div>
        <div class="unified-content">
            <div class="temp-section">
                <div class="main-value">
                    <span id="avg-temp">--</span><span class="unit">°C</span>
                    <div id="temp-trend"></div>
                </div>
                <div class="extremes-side">
                    <div class="extreme-item">
                        <span class="label">Min:</span>
                        <span id="min-temp">--</span><span class="unit">°C</span>
                    </div>
                    <div class="extreme-item">
                        <span class="label">Max:</span>
                        <span id="max-temp">--</span><span class="unit">°C</span>
                    </div>
                </div>
            </div>

            <div class="dew-point-section">
                <div class="dew-header">
                    <div class="dew-title-group">
                        <span class="dew-title">Dew Point Spread</span>
                        <div class="dew-values">
                            <span class="dew-main" id="dew-spread-val">--°</span>
                            <span class="dew-sub">T: <span id="dew-t">--</span>° · Td: <span id="dew-td">--</span>°</span>
                        </div>
                    </div>
                    <div class="dew-status-badge" id="dew-status">Caution</div>
                </div>
                <div class="gauge-container">
                    <div class="gauge-track">
                        <div class="gauge-track-inner">
                            <div class="gauge-marker" id="gauge-pin"></div>
                        </div>
                    </div>
                    <div class="gauge-labels">
                        <span>0°</span>
                        <span>2°</span>
                        <span>4°</span>
                        <span>6°</span>
                        <span>8°</span>
                        <span>10°+</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- row-metric: pressure + humidity stay side by side; wetness wraps below on small screens -->
<div class="dashboard-row row-metric">
    <div class="pressure_block unified-card" id="pressure-card">
        <div class="card-header">
            <h3>Pressure</h3>
            <span class="status-circle"></span>
            <div class="details-popup"></div>
        </div>
        <div class="metric-content">
            <div class="main-value">
                <span id="avg-pressure"></span><span class="unit">hPa</span>
                <div id="pressure-trend"></div>
            </div>
        </div>
    </div>

    <div class="humidity_block unified-card" id="humidity-card">
        <div class="card-header">
            <h3>Humidity</h3>
            <span class="status-circle"></span>
            <div class="details-popup"></div>
        </div>
        <div class="metric-content">
            <div class="main-value">
                <span id="humidity-val"></span><span class="unit">%</span>
            </div>
            <div class="humidity-dew-line">
                <span class="dew-label">Dew point:</span>
                <span class="dew-value" id="humidity-dew-val">--°C</span>
            </div>
        </div>
    </div>

    <div class="wetness_block unified-card" id="wetness-card">
        <div class="card-header">
            <h3>Surface Wetness</h3>
            <span class="status-circle"></span>
            <div class="details-popup"></div>
        </div>
        <div class="metric-content">
            <div class="wetness-status-badge wetness-dry" id="wetness-badge">
                <span class="wetness-status-dot"></span>
                <span id="wetness-status-text">Dry</span>
            </div>
            <div class="wetness-meta">
                <span class="wetness-pct" id="wetness-pct">Wetness --</span>
                <div class="wetness-track">
                    <div class="wetness-bar" id="wetness-bar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="chart_block">

    <div class="chart-header">
        <h3>24-Hour Trend</h3>

        <div class="metric-selector">
            <span class="selector-label">View:</span>
            <select id="metric-selector" class="metric-dropdown">
                <option value="temperature">Temperature</option>
                <option value="pressure">Pressure</option>
                <option value="humidity">Humidity</option>
            </select>
            <select id="resolution-selector" class="resolution-dropdown">
                <option value="2">2 min</option>
                <option value="5">5 min</option>
                <option value="10" selected>10 min</option>
                <option value="30">30 min</option>
                <option value="60">60 min</option>
            </select>
        </div>
    </div>

    <div class="chart-container" style="position: relative; height:200px; width:100%;">
        <canvas id="weatherChart"></canvas>
    </div>

</div>
<div class="system_health_block">
    <h3>System Health</h3>
    <div class="health-grid">
        <div class="health-item">
            <label>Status</label>
            <span id="status"></span>
        </div>
        <div class="health-item">
            <label>Lag</label>
            <span id="lag"></span>
        </div>
        <div class="health-item">
            <label>Today Records</label>
            <span id="todayRecords"></span>
        </div>
        <div class="health-item">
            <label>Last Update</label>
            <span id="lastUpdate"></span>
        </div>
    </div>
</div>

<script th:src="@{/js/realtime-script.js}"></script>
<script type="module" th:src="@{/js/fetch-data.js}"></script>
</body>
</html>

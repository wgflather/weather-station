<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="safari-top-anchor"></div>
<div class="safari-bottom-anchor"></div>
<div class="login-wrapper">

    <div class="login-card weather_block">
        <h3>System Login</h3>

        <!-- Spring Security error handling -->
        <div class="error-msg" th:if="${param.error}">
            Invalid username or password
        </div>

        <div class="error-msg" th:if="${param.logout}">
            You have been logged out
        </div>

        <form class="login-form" method="post" action="/login">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       required />
            </div>

            <!-- Spring Security CSRF token (IMPORTANT) -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button type="submit">Login</button>
        </form>

    </div>

</div>

</body>
</html>

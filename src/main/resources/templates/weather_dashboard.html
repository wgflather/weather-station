<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script>
        let weatherChartInstance = null;

/**
 * Calculates the dynamic Y-axis bounds based on the data range.
 * Adds a +/- 3 degree buffer to keep the line from hitting the edges.
 */
function getDynamicYBounds(points) {
    if (!points || points.length === 0) return { min: 10, max: 30 }; // Default fallbacks
    
    const values = points.map(p => p.y);
    return {
        suggestedMin: Math.min(...values) - 2,
        suggestedMax: Math.max(...values) + 2
    };
}

async function initWeatherChart() {
    try {
        const response = await fetch('/api/weather/chart');
        if (!response.ok) throw new Error('Network response was not ok');

        const backendData = await response.json();

        // 1. Map to Chart.js objects
        const chartPoints = backendData.map(item => ({
            x: new Date(item.hour),
            y: item.hourlyValue
        }));

        // 2. Define Chart Window (00:00 to 23:59)
        const startOfDay = new Date();
        startOfDay.setHours(0, 0, 0, 0);
        const endOfDay = new Date();
        endOfDay.setHours(23, 59, 59, 999);

        // 3. Get Scale Buffer
        const yBounds = getDynamicYBounds(chartPoints);

        const ctx = document.getElementById('weatherChart').getContext('2d');
        if (weatherChartInstance) {
            weatherChartInstance.destroy();
        }

        // 4. Create Instance
        weatherChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Temperature (°C)',
                    data: chartPoints,
                    borderColor: '#4bc0c0',
                    backgroundColor: 'rgba(75, 192, 192, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0, // Clean look for 5-min intervals
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'hour',
                            displayFormats: { hour: 'H' }, // Clean mobile-friendly format
                            tooltipFormat: 'HH:mm'
                        },
                        min: startOfDay,
                        max: endOfDay,
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 12,
                            color: '#2c3e50'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        suggestedMin: yBounds.suggestedMin,
                        suggestedMax: yBounds.suggestedMax,
                        ticks: {
                            stepSize: 1, // Cleaner grid spacing
                            callback: (val) => val + '°'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                },
                plugins: {
                    legend: { display: false } // Hide if title is already descriptive
                }
            }
        });

    } catch (error) {
        console.error('Error loading chart data:', error);
    }
}

document.addEventListener('DOMContentLoaded', initWeatherChart);
    </script>
</head>
<body th:with="d=${dashboard}">

<div class="today_data_block">
    <h1>
        Weather Report:
        <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"></span>
    </h1>

    <div th:if="${d.systemHealthDashboardDto.status.name() == 'EMPTY'}" class="error-msg">
        <h1>⚠️ No data available in database</h1>
    </div>
</div>

<div class="dashboard-row"
     th:if="${d.systemHealthDashboardDto.status.name() != 'EMPTY'}">

    <!-- Weather block -->
    <div class="temperature_block">
    <h3>Temperature (5-min avg)</h3>
    <div class="metric-content">
        <!-- Big Left Side -->
        <div class="main-value">
            <span id="avg-temp" th:text="${d.metricsDashboardDto.averages.avgTemperature != null
                                ? d.metricsDashboardDto.averages.avgTemperature
                                : 'N/A'}"></span><span class="unit">°C</span>
        </div>
        
        <!-- Small Right Side -->
        <div class="extremes-side">
            <div class="extreme-item">
                <span class="label">Min:</span>
                <span id="min-temp" th:text="${d.metricsDashboardDto.minMaxTempValue.minValue}"></span>
            </div>
            <div class="extreme-item">
                <span class="label">Max:</span>
                <span id="max-temp" th:text="${d.metricsDashboardDto.minMaxTempValue.maxValue}"></span>
            </div>
        </div>
    </div>
</div>

    <div class="pressure_block">
        <h3>Pressure <small>(5-min avg)</small></h3>
            <div class="main-value">
             <span id="avg-temp"
                  th:text="${d.metricsDashboardDto.averages.avgPressure != null
                                ? d.metricsDashboardDto.averages.avgPressure
                                : 'N/A'}"></span><span class="unit">hPa</span>
            </div>
        </div>
    </div>


<!-- Chart -->
<div class="chart_block"
     th:if="${d.systemHealthDashboardDto.status.name() != 'EMPTY'}">
    <h3>24-Hour Temperature Trend</h3>
    <div class="chart-container" style="position: relative; height:200px; width:100%;">
        <canvas id="weatherChart"></canvas>
    </div>
</div>

<!-- System health -->
<div class="system_health_block"
     th:if="${d.systemHealthDashboardDto.status.name() != 'EMPTY'}">

    <h3>System Health</h3>

    <div class="health-grid">
        <div class="health-item">
            <label>Status</label>
            <span th:text="${d.systemHealthDashboardDto.status}"
                  th:classappend="${d.systemHealthDashboardDto.status.name() == 'LIVE' ? 'status-live' : ''}">
                </span>
        </div>

        <div class="health-item">
            <label>Lag</label>
            <span th:text="${d.systemHealthDashboardDto.lagMinutes} + ' min'"></span>
        </div>

        <div class="health-item">
            <label>Records</label>
            <span th:text="${d.systemHealthDashboardDto.recordsToday}"></span>
        </div>

        <div class="health-item">
            <label>Last Update</label>
            <span th:text="${#temporals.format(d.systemHealthDashboardDto.lastMeasuredAt, 'HH:mm:ss')}"></span>
        </div>
    </div>
</div>
</body>
</html>

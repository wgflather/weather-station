<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let weatherChartInstance = null; // Track the chart instance

        async function initWeatherChart() {
            try {
                const response = await fetch('/api/weather/chart');
                if (!response.ok) throw new Error('Network response was not ok');

                const backendData = await response.json();

                const labels = backendData.map(item => {
        // 1. Try to parse the date (works for "2026-04-29T20:00:00.000Z")
        const date = new Date(item.hour);

    // 2. Check if parsing failed
        if (isNaN(date.getTime())) {
            // Fallback: If it's a standard ISO string, just cut out the "HH:mm" part
            // Example: "2026-04-29T15:30:00" -> returns "15:30"
            if (typeof item.hour === 'string' && item.hour.includes('T')) {
                return item.hour.split('T')[1].substring(0, 5);
            }
            return "??:??"; // Last resort
        }

        // 3. If parsing worked, format it to local time (Kharkiv)
        return date.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false // Use 24-hour format
        });
    });

                const temperatures = backendData.map(item => item.hourlyValue);

                const ctx = document.getElementById('weatherChart').getContext('2d');

                // Fix: If chart already exists, destroy it before creating a new one
                if (weatherChartInstance) {
                    weatherChartInstance.destroy();
                }

                weatherChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Temperature (°C)',
                            data: temperatures,
                            borderColor: '#4bc0c0',
                            backgroundColor: 'rgba(75, 192, 192, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false, // Allows it to fill the container height
                        scales: {
                            x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } }
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading chart data:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', initWeatherChart);
    </script>
</head>
<body th:with="d=${dashboard}">

    <div class="today_data_block">
        <h1>Weather Report: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"></span></h1>
        <div th:if="${d.status.name() == 'EMPTY'}" class="error-msg">
            <h1>⚠️ No data available in database</h1>
        </div>
    </div>

    <div class="dashboard-row" th:if="${d.status.name() != 'EMPTY'}">
        
        <div class="weather_block">
            <h3>Current Weather <small>(5-min avg)</small></h3>
            <div class="data-point">
                <p>Temperature</p>
                <span class="temperature" th:text="${d.averages.avgTemperature != null ? d.averages.avgTemperature + ' °C' : 'N/A'}"></span>
            </div>
            <div class="data-point">
                <p>Pressure</p>
                <span class="pressure" th:text="${d.averages.avgPressure != null ? d.averages.avgPressure + ' hPa' : 'N/A'}"></span>
            </div>
        </div>

        <div class="min_max_block">
            <h3>Temperature Extremes</h3>
            <div th:if="${d.minMaxTempValue}" class="min-max-container">
                <div class="temp-stat min">
                    <p>Min</p>
                    <h2 th:text="${d.minMaxTempValue.minValue} + ' °C'"></h2>
                    <small th:text="'at ' + ${#temporals.format(d.minMaxTempValue.minAt, 'HH:mm:ss')}"></small>
                </div>
                <div class="temp-stat max">
                    <p>Max</p>
                    <h2 th:text="${d.minMaxTempValue.maxValue} + ' °C'"></h2>
                    <small th:text="'at ' + ${#temporals.format(d.minMaxTempValue.maxAt, 'HH:mm:ss')}"></small>
                </div>
            </div>
            <h2 th:unless="${d.minMaxTempValue}">Not enough data</h2>
        </div>
    </div>

    <div class="chart_block" th:if="${d.status.name() != 'EMPTY'}">
        <h3>24-Hour Temperature Trend</h3>
        <div class="chart-container" style="position: relative; height:300px; width:100%;">
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <div class="system_health_block" th:if="${d.status.name() != 'EMPTY'}">
        <h3>System Health</h3>
        <div class="health-grid">
            <div class="health-item">
                <label>Status</label>
                <span th:text="${d.status}" th:classappend="${d.status.name() == 'LIVE' ? 'status-live' : ''}"></span>
            </div>
            <div class="health-item">
                <label>Lag</label>
                <span th:text="${d.lagMinutes} + ' min'"></span>
            </div>
            <div class="health-item">
                <label>Records</label>
                <span th:text="${d.recordsToday}"></span>
            </div>
            <div class="health-item">
                <label>Last Update</label>
                <span th:text="${#temporals.format(d.lastMeasuredAt, 'HH:mm:ss')}"></span>
            </div>
        </div>
    </div>

</body>
</html>

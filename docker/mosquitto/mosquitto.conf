# Mosquitto 2.x refuses anonymous connections by default and binds only to
# localhost without an explicit listener — either alone is enough to make the
# bundled broker look broken. Both are set here so the full-stack compose
# works with no configuration.
#
# This is a LAN/dev posture. Exposing port 1883 to the internet with these
# settings means anyone can publish fake readings into your station; put a
# password_file here and drop allow_anonymous before doing that.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

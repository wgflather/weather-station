name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest ships one running.
      - name: Run tests
        run: ./mvnw -B verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Pull requests from forks can't have registry credentials, and publishing
    # an image per PR isn't wanted anyway — build is validated by `test`.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The built-in GITHUB_TOKEN is enough to push to GHCR for this repo.
      # This is what replaces the GIT_TOKEN build-arg the Dockerfile used to
      # need: no PAT to mint, store or rotate.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # Links the package to this repo on GitHub and is what lets the
          # package inherit repo visibility.
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile pins its build stage to $BUILDPLATFORM, so the Maven
          # compile runs once natively and only the JRE layer varies per arch —
          # no QEMU, no per-arch rebuild.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
